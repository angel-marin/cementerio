<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La noche del enterrador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;700&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="c" tabindex="-1"></canvas>

<div id="hud">
  <div id="inv"><span id="invText">Bolsillos vacíos</span></div>
  <div id="status" hidden></div>
  <div id="cross"></div>
  <div id="hint"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="subs" aria-live="polite"></div>
  <div id="dialog" aria-live="polite"></div>
  <div id="rhythm" aria-hidden="true"><div class="rh-text"></div><div class="rh-stage"><div class="rh-target"></div><div class="rh-ring"></div></div><div class="rh-bar"><i></i></div></div>
  <button id="journalBtn" type="button" hidden>Diario</button>
  <div id="resume">Haz clic para volver al juego</div>
</div>

<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <button id="flashBtn" type="button" hidden>Linterna</button>
  <button id="use" type="button">Usar</button>
</div>

<div id="fade"></div>
<div class="screen" id="start"></div>
<div class="screen" id="end"></div>
<div class="screen" id="modal"></div>
<div class="screen" id="debug"></div>

<script src="https://cdn.jsdelivr.net/npm/babylonjs@7.30.0/babylon.js"></script>
<script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@7.30.0/babylonjs.loaders.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
